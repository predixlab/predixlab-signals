[project]
name = "predixlab-signals"
version = "0.1.0"
description = "Lightweight swing-point (local high/low) prediction model producing actionable buy/sell advice."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "lightgbm>=4.0",
    # LightGBM's LGBMRegressor/LGBMClassifier wrappers are a scikit-learn API and
    # refuse to import without it, so it is a hard runtime requirement here.
    "scikit-learn>=1.4",
    # Parquet backend for pandas; used for every dataset and report artifact.
    "pyarrow>=14.0",
]

[project.scripts]
predixlab-signals = "predixlab_signals.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Everything the scheduled Azure Container Apps job needs on top of the research
# core: a MongoDB driver, structured logging and the notification transport.
job = [
    "pymongo>=4.10",
    "loguru>=0.7",
    "azure-communication-email>=1.0",
    "azure-storage-queue>=12.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/predixlab_signals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
